[project]
name = "murmurs-detection"
version = "0.1.0"
description = "Deteção de sopros cardíacos no dataset CirCor DigiScope (ML II 2026/2027)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
]

[tool.uv]
package = false
