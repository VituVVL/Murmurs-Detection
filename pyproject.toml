[project]
name = "murmurs-detection"
version = "0.1.0"
description = "Deteção de sopros cardíacos no dataset CirCor DigiScope (ML II 2026/2027)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
]

[tool.uv]
package = false

# torch com CUDA 13.2 (Windows e Linux). Usa a GPU NVIDIA se existir; num PC sem GPU corre no CPU na mesma.
# Assim `uv sync` / `uv run` instalam sempre esta versão (antes trocavam-na pelo torch só CPU do PyPI).
# No macOS não há builds CUDA: fica o torch normal do PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
